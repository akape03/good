<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}
  <h2>회원가입</h2>
  <form action="/register" method="post">
    Username:<br>
    <input type="text" id="username" name="username">
    <br><br>
    Password:<br>
    <input type="password" id="password" name="password">
    <br><br>
    <button>회원가입</button>
  </form>
  <br>
  <form action="/login">
    <button>로그인 하러가기</button>
  </form>
{% endblock %}
</body>
</html>
